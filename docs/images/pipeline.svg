<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1246 192" width="1246" height="192"
  font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>BACoN pipeline: bait, filter, assemble, compare</title>
  <style>:root { --text: #1d2433; --muted: #5d6678; --box: #f6f7f9; --edge: #d7dbe2; --arrow: #8a93a3 } @media (prefers-color-scheme: dark) { :root { --text: #e6e8ec; --muted: #9aa3b2; --box: #1d2129; --edge: #363c47; --arrow: #737d8e } }</style>
  <rect x="12" y="76" width="80" height="38" rx="19" fill="none" stroke="#d94f3d" stroke-width="1.6"/>
  <text x="52.0" y="101" text-anchor="middle" font-size="15.5" font-weight="600" fill="var(--text)">reads</text>
  <line x1="92" y1="95" x2="115" y2="95" stroke="var(--arrow)" stroke-width="2"/><path d="M124,95 l-10,-5 v10 z" fill="var(--arrow)"/>
  <rect x="124" y="40" width="182" height="112" rx="12" fill="var(--box)" stroke="var(--edge)"/>
  <circle cx="149" cy="67" r="13" fill="#d94f3d"/>
  <text x="149" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>
  <text x="170" y="73" font-size="19" font-weight="700" fill="var(--text)">Bait</text>
  <text x="140" y="100" font-size="14" fill="var(--muted)">minimap2 (map-ont)</text>
  <text x="140" y="121" font-size="14" fill="var(--muted)">or BBDuk</text>
  <line x1="306" y1="95" x2="329" y2="95" stroke="var(--arrow)" stroke-width="2"/><path d="M338,95 l-10,-5 v10 z" fill="var(--arrow)"/>
  <rect x="338" y="40" width="206" height="112" rx="12" fill="var(--box)" stroke="var(--edge)"/>
  <circle cx="363" cy="67" r="13" fill="#d94f3d"/>
  <text x="363" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>
  <text x="384" y="73" font-size="19" font-weight="700" fill="var(--text)">Filter</text>
  <text x="354" y="100" font-size="14" fill="var(--muted)">Filtlong: the best reads,</text>
  <text x="354" y="121" font-size="14" fill="var(--muted)">up to the target depth</text>
  <line x1="544" y1="95" x2="567" y2="95" stroke="var(--arrow)" stroke-width="2"/><path d="M576,95 l-10,-5 v10 z" fill="var(--arrow)"/>
  <rect x="576" y="40" width="252" height="112" rx="12" fill="var(--box)" stroke="var(--edge)"/>
  <circle cx="601" cy="67" r="13" fill="#d94f3d"/>
  <text x="601" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>
  <text x="622" y="73" font-size="19" font-weight="700" fill="var(--text)">Assemble</text>
  <text x="592" y="100" font-size="14" fill="var(--muted)">templated: samtools consensus</text>
  <text x="592" y="121" font-size="14" fill="var(--muted)">de novo: Flye or myloasm</text>
  <line x1="828" y1="95" x2="851" y2="95" stroke="var(--arrow)" stroke-width="2"/><path d="M860,95 l-10,-5 v10 z" fill="var(--arrow)"/>
  <rect x="860" y="40" width="252" height="112" rx="12" fill="var(--box)" stroke="var(--edge)"/>
  <circle cx="885" cy="67" r="13" fill="#d94f3d"/>
  <text x="885" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">4</text>
  <text x="906" y="73" font-size="19" font-weight="700" fill="var(--text)">Compare</text>
  <text x="876" y="100" font-size="14" fill="var(--muted)">SNPs: minimap2, SKA2 or Parsnp</text>
  <text x="876" y="121" font-size="14" fill="var(--muted)">tree: FastTree or IQ-TREE</text>
  <line x1="1112" y1="95" x2="1135" y2="95" stroke="var(--arrow)" stroke-width="2"/><path d="M1144,95 l-10,-5 v10 z" fill="var(--arrow)"/>
  <rect x="1144" y="76" width="90" height="38" rx="19" fill="none" stroke="#d94f3d" stroke-width="1.6"/>
  <text x="1189.0" y="101" text-anchor="middle" font-size="15.5" font-weight="600" fill="var(--text)">report</text>
</svg>
