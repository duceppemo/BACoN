<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1142 190" width="1142" height="190"
  font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>BACoN pipeline: bait, filter, assemble, compare</title>
  <rect x="12" y="77" width="74" height="36" rx="18" fill="none" stroke="#c2402f" stroke-width="1.6"/>
  <text x="49.0" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#e6e8ec">reads</text>
  <line x1="86" y1="95" x2="109" y2="95" stroke="#737d8e" stroke-width="2"/><path d="M118,95 l-10,-5 v10 z" fill="#737d8e"/>
  <rect x="118" y="40" width="168" height="110" rx="12" fill="#1d2129" stroke="#363c47"/>
  <circle cx="142" cy="66" r="12" fill="#c2402f"/>
  <text x="142" y="71" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <text x="162" y="71" font-size="17" font-weight="700" fill="#e6e8ec">Bait</text>
  <text x="134" y="96" font-size="12.5" fill="#9aa3b2">minimap2 (map-ont)</text>
  <text x="134" y="115" font-size="12.5" fill="#9aa3b2">or BBDuk</text>
  <line x1="286" y1="95" x2="309" y2="95" stroke="#737d8e" stroke-width="2"/><path d="M318,95 l-10,-5 v10 z" fill="#737d8e"/>
  <rect x="318" y="40" width="172" height="110" rx="12" fill="#1d2129" stroke="#363c47"/>
  <circle cx="342" cy="66" r="12" fill="#c2402f"/>
  <text x="342" y="71" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
  <text x="362" y="71" font-size="17" font-weight="700" fill="#e6e8ec">Filter</text>
  <text x="334" y="96" font-size="12.5" fill="#9aa3b2">Filtlong: the best reads,</text>
  <text x="334" y="115" font-size="12.5" fill="#9aa3b2">up to the target depth</text>
  <line x1="490" y1="95" x2="513" y2="95" stroke="#737d8e" stroke-width="2"/><path d="M522,95 l-10,-5 v10 z" fill="#737d8e"/>
  <rect x="522" y="40" width="230" height="110" rx="12" fill="#1d2129" stroke="#363c47"/>
  <circle cx="546" cy="66" r="12" fill="#c2402f"/>
  <text x="546" y="71" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
  <text x="566" y="71" font-size="17" font-weight="700" fill="#e6e8ec">Assemble</text>
  <text x="538" y="96" font-size="12.5" fill="#9aa3b2">templated: samtools consensus</text>
  <text x="538" y="115" font-size="12.5" fill="#9aa3b2">de novo: Flye or myloasm</text>
  <line x1="752" y1="95" x2="775" y2="95" stroke="#737d8e" stroke-width="2"/><path d="M784,95 l-10,-5 v10 z" fill="#737d8e"/>
  <rect x="784" y="40" width="230" height="110" rx="12" fill="#1d2129" stroke="#363c47"/>
  <circle cx="808" cy="66" r="12" fill="#c2402f"/>
  <text x="808" y="71" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
  <text x="828" y="71" font-size="17" font-weight="700" fill="#e6e8ec">Compare</text>
  <text x="800" y="96" font-size="12.5" fill="#9aa3b2">SNPs: minimap2, SKA2 or Parsnp</text>
  <text x="800" y="115" font-size="12.5" fill="#9aa3b2">tree: FastTree or IQ-TREE</text>
  <line x1="1014" y1="95" x2="1037" y2="95" stroke="#737d8e" stroke-width="2"/><path d="M1046,95 l-10,-5 v10 z" fill="#737d8e"/>
  <rect x="1046" y="77" width="82" height="36" rx="18" fill="none" stroke="#c2402f" stroke-width="1.6"/>
  <text x="1087.0" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#e6e8ec">report</text>
</svg>
