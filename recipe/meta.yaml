# Bioconda recipe, a copy of bioconda-recipes/recipes/bacon-nanopore (published since 0.3.5). The sha256 is that
# of the GitHub tarball for tag v{{ version }} (curl -sL <url> | sha256sum). For a new release: bump `version`,
# recompute the sha256, reset `number` to 0, and update bioconda-recipes (its autobump bot usually does).
# The package is named bacon-nanopore because conda-forge already has an unrelated `bacon`.
{% set name = "bacon-nanopore" %}
{% set version = "0.3.6" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/duceppemo/BACoN/archive/refs/tags/v{{ version }}.tar.gz
  sha256: dcf732f66379329ba8555ac981900ac3fbd92a1cfdd76bc4e4b6a368b6479683

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=68
  run:
    - python >=3.10
    - minimap2 >=2.24
    - samtools >=1.21
    - filtlong >=0.2.1
    - flye >=2.9.5
    - myloasm >=0.7
    - ska2 >=0.5
    - parsnp >=2.1.2
    - harvesttools
    - fasttree >=2.1.11
    - iqtree >=2.2
    - bbmap >=39
    - python-isal

test:
  commands:
    - bacon --help
    - bacon --version

about:
  home: https://github.com/duceppemo/BACoN
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Bait, assemble and compare Nanopore reads matching a reference sequence, such as an organelle genome
  dev_url: https://github.com/duceppemo/BACoN
  doc_url: https://github.com/duceppemo/BACoN/wiki

extra:
  recipe-maintainers:
    - duceppemo
