name: Bug report
description: Something did not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you run, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact command, and `bacon.log` (add `--debug`). Paste as text, not a screenshot.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      description: Output of `bacon --version`, and your OS. The tool versions are in `run_info.json`.
      placeholder: BACoN 0.3.0, Ubuntu 24.04
    validations:
      required: true
